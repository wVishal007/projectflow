name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  server:
    name: Server Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: projectflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: server

      - name: Push schema to database
        run: npx prisma db push --accept-data-loss
        working-directory: server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/projectflow_test?schema=public

      - name: Typecheck
        run: npm run typecheck -w server

      - name: Run tests
        run: npm run test:coverage -w server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/projectflow_test?schema=public
          JWT_ACCESS_SECRET: test-access-secret-minimum-16-characters
          JWT_REFRESH_SECRET: test-refresh-secret-minimum-16-characters
          NODE_ENV: test

      - name: Build
        run: npm run build -w server

  client:
    name: Client Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck -w client

      - name: Build
        run: npm run build -w client
